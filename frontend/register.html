<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Регистрация — Medical Navigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="banner">Демо-версия: используйте только вымышленные данные и документы.</div>
<header class="top"><a class="brand" href="/">Medical Navigator</a><nav id="nav"></nav></header>
<main class="wrap narrow">
  <h1>Регистрация пациента</h1>
  <form data-auth="register">
    <label>Имя<input name="full_name" autocomplete="name" required></label>
    <label>Email<input type="email" name="email" autocomplete="username" required></label>
    <label>Телефон<input type="tel" name="phone" autocomplete="tel"></label>
    <label>Пароль (не короче 8 символов)<input type="password" name="password" minlength="8" autocomplete="new-password" required></label>
    <p id="msg" class="flash err" role="alert" style="display:none"></p>
    <button class="btn">Создать аккаунт</button>
  </form>
  <p>Уже есть аккаунт? <a href="/login.html">Войти</a></p>
</main>
<script src="/js/api.js"></script><script src="/js/auth.js"></script>
<style>#msg:not(:empty){display:block!important}</style>
</body></html>
